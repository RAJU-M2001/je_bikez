
name: Trigger JE BikeZ Automation Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-automation:
    name: Trigger Automation Repository
    runs-on: ubuntu-latest

    steps:
      - name: Validate Automation Token
        env:
          GH_TOKEN: ${{ secrets.JE_BIKEZ_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing JE_BIKEZ_AUTOMATION_TOKEN secret."
            exit 1
          fi

      - name: Trigger Playwright Automation
        env:
          GH_TOKEN: ${{ secrets.JE_BIKEZ_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/RAJU-M2001/je_bikez_automation/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"event_type":"je_bikez_app_updated"}'

          echo "Automation workflow triggered successfully."
